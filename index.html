<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Documents</title>
<style>
body { font-family: sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
.container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
h1 { font-size: 20px; margin-bottom: 20px; color: #2c3e50; }
ul { list-style: none; padding: 0; margin: 0; }
li { margin-bottom: 12px; }
a { display: block; background: #e74c3c; color: #fff; padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold; }
a:hover { background: #c0392b; }
</style>
</head>
<body>
<div class="container">
<h1>My PDF Files</h1>
<ul>
<li><a href="datoku.pdf">datoku.pdf</a></li>
<li><a href="ctgtoda.pdf">ctgtoda.pdf</a></li>
<li><a href="ctgfeni.pdf">ctgfeni.pdf</a></li>
</ul>
</div>
</body>
</html>
